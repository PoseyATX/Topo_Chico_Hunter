  :root {
    color-scheme: light;
    --bg: #f6ecd8;
    --surface: #fffaf0;
    --ink: #2b1710;
    --ink-2: #6b4632;
    --muted: #9c7e5f;
    --line: #e3cfa3;
    --red: #c1272d;
    --red-strong: #841418;
    --blue: #0f5ea8;
    --blue-strong: #0a3f73;
    --gold: #d99a2b;
    --gold-wash: #f4e2ba;
    --wash: #f0e0bb;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --neutral-status: #8a7156;
    --shadow: 0 1px 2px rgba(43, 23, 16, 0.08), 0 10px 26px rgba(43, 23, 16, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #1c110a;
      --surface: #271811;
      --ink: #f7ead4;
      --ink-2: #d9bb99;
      --muted: #a5876a;
      --line: #3d2a1b;
      --red: #e2555a;
      --red-strong: #ff7a7e;
      --blue: #5aa8de;
      --blue-strong: #86c2ea;
      --gold: #eab54a;
      --gold-wash: #3a2a17;
      --wash: #33230f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c110a;
    --surface: #271811;
    --ink: #f7ead4;
    --ink-2: #d9bb99;
    --muted: #a5876a;
    --line: #3d2a1b;
    --red: #e2555a;
    --red-strong: #ff7a7e;
    --blue: #5aa8de;
    --blue-strong: #86c2ea;
    --gold: #eab54a;
    --gold-wash: #3a2a17;
    --wash: #33230f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.4);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6ecd8;
    --surface: #fffaf0;
    --ink: #2b1710;
    --ink-2: #6b4632;
    --muted: #9c7e5f;
    --line: #e3cfa3;
    --red: #c1272d;
    --red-strong: #841418;
    --blue: #0f5ea8;
    --blue-strong: #0a3f73;
    --gold: #d99a2b;
    --gold-wash: #f4e2ba;
    --wash: #f0e0bb;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .serape {
    height: 7px;
    background: repeating-linear-gradient(
      -45deg,
      var(--red) 0 10px,
      var(--gold) 10px 20px,
      var(--blue) 20px 30px,
      var(--surface) 30px 40px
    );
  }
  .picado {
    height: 10px;
    background:
      linear-gradient(135deg, transparent 60%, var(--bg) 60%) 0 0 / 14px 14px,
      linear-gradient(-135deg, transparent 60%, var(--bg) 60%) 0 0 / 14px 14px;
    background-color: var(--ink);
    opacity: 0.9;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  header.masthead {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    padding: 26px 0 22px;
    overflow: hidden;
  }
  .title-block { display: flex; align-items: center; gap: 18px; z-index: 1; }
  .medallion {
    width: 64px; height: 64px; flex: none;
    position: relative;
  }
  .medallion .rays {
    position: absolute; inset: -14px;
    background: repeating-conic-gradient(var(--gold) 0deg 6deg, transparent 6deg 24deg);
    border-radius: 50%;
    opacity: 0.55;
  }
  .medallion svg {
    position: relative;
    width: 64px; height: 64px;
    filter: drop-shadow(0 2px 4px rgba(43, 23, 16, 0.25));
  }
  h1 {
    font-family: "Alex Brush", cursive;
    font-weight: 400;
    font-size: 3rem;
    line-height: 0.9;
    color: var(--red);
    margin: 0;
    text-wrap: balance;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
  }
  .eyebrow {
    font-family: "Alfa Slab One", cursive;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue);
    margin: 0 0 4px;
  }
  .meta-block {
    text-align: right;
    font-size: 0.82rem;
    color: var(--ink-2);
    z-index: 1;
  }
  .meta-block code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--gold-wash);
    color: var(--red-strong);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.8rem;
    border: 1px solid var(--line);
  }
  .meta-block .updated { color: var(--muted); margin-top: 4px; }

  .banner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--gold-wash);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    margin: 20px 0;
    font-size: 0.86rem;
    color: var(--ink-2);
  }
  .banner svg { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--red); }
  .banner strong { color: var(--ink); }
  .banner a { color: var(--blue-strong); }
  .banner code {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 22px 0 24px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--gold);
    border-radius: 6px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat-tile .n {
    font-family: "Alfa Slab One", cursive;
    font-size: 2.1rem;
    line-height: 1;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .stat-tile .l {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-tile.good { border-top-color: var(--good); }
  .stat-tile.good .n { color: var(--good); }
  .stat-tile.warning { border-top-color: var(--warning); }
  .stat-tile.warning .n { color: #916300; }
  @media (prefers-color-scheme: dark) { .stat-tile.warning .n { color: var(--warning); } }
  :root[data-theme="dark"] .stat-tile.warning .n { color: var(--warning); }
  .stat-tile.critical { border-top-color: var(--critical); }
  .stat-tile.critical .n { color: var(--critical); }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    z-index: 5;
  }
  .controls input[type="search"] {
    flex: 1 1 220px;
    min-width: 160px;
    padding: 9px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.9rem;
  }
  .controls select {
    padding: 9px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.9rem;
  }
  .controls input:focus-visible, .controls select:focus-visible, button:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  .result-count { font-size: 0.8rem; color: var(--muted); margin-left: auto; }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 640px; }
  thead th {
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--red-strong);
    padding: 12px 14px;
    border-bottom: 2px solid var(--gold);
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--wash);
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--gold-wash); }
  .store-name { font-weight: 600; color: var(--ink); }
  .store-addr { color: var(--muted); font-size: 0.82rem; }
  td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.76rem;
    font-weight: 700;
    white-space: nowrap;
    border: 1px dashed currentColor;
  }
  .chip::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .chip.in-stock { background: rgba(12, 163, 12, 0.1); color: var(--good); }
  .chip.limited { background: rgba(250, 178, 25, 0.14); color: #8a6100; }
  @media (prefers-color-scheme: dark) { .chip.limited { color: var(--warning); } }
  :root[data-theme="dark"] .chip.limited { color: var(--warning); }
  .chip.out-of-stock { background: rgba(208, 59, 59, 0.1); color: var(--critical); }
  .chip.unknown { background: rgba(138, 113, 86, 0.14); color: var(--neutral-status); }

  .empty-state, .no-results {
    text-align: center;
    padding: 64px 24px;
    color: var(--ink-2);
  }
  .empty-state h2, .no-results h2 { font-family: "Alfa Slab One", cursive; font-size: 1.2rem; margin: 0 0 8px; color: var(--red); }
  .empty-state code {
    display: block;
    margin-top: 14px;
    background: var(--gold-wash);
    color: var(--red-strong);
    padding: 10px 14px;
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.82rem;
    max-width: 420px;
    margin-inline: auto;
    border: 1px solid var(--line);
  }

  footer {
    margin-top: 28px;
    padding-top: 18px;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
  footer a { color: var(--blue-strong); }
</style>
</head>
<body>
<div class="serape"></div>
<div class="picado"></div>
<div class="wrap">
  <header class="masthead">
    <div class="title-block">
      <div class="medallion" aria-hidden="true">
        <div class="rays"></div>
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" fill="var(--surface)" stroke="var(--red)" stroke-width="3"/>
          <circle cx="32" cy="32" r="24" fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="2 3"/>
          <path d="M17 36c4-6 8 6 12 0s8-6 12 0" stroke="var(--blue)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M32 12l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6-5.8-3.6-5.8 3.6 1.6-6.6-5.1-4.4 6.7-.6z" fill="var(--gold)" stroke="var(--red)" stroke-width="1"/>
        </svg>
      </div>
      <div>
        <p class="eyebrow">Texas Stock Finder</p>
        <h1>Topo Chico Hunter</h1>
      </div>
    </div>
    <div class="meta-block">
      <div>UPC <code id="upc-code">—</code></div>
      <div class="updated" id="updated-line">Loading…</div>
    </div>
  </header>

  <div id="app"></div>

  <footer>
    Target stores only — checked via Target's public product-availability API. H-E-B and Walmart aren't
    included: neither publishes a public per-store inventory API to query responsibly.
    <br />
    <a href="https://github.com/PoseyATX/Topo_Chico_Hunter" target="_blank" rel="noopener">Source on GitHub</a>
    · Refreshed daily by GitHub Actions
  </footer>
</div>

<script>
(function () {
  const STATUS_META = {
    IN_STOCK: { label: "In stock", chip: "in-stock" },
    LIMITED_STOCK: { label: "Limited stock", chip: "limited" },
    OUT_OF_STOCK: { label: "Out of stock", chip: "out-of-stock" },
    NOT_SOLD_IN_STORE: { label: "Not sold here", chip: "out-of-stock" },
    UNKNOWN: { label: "Unknown", chip: "unknown" },
  };

  const app = document.getElementById("app");
  const upcCode = document.getElementById("upc-code");
  const updatedLine = document.getElementById("updated-line");

  function timeAgo(iso) {
    if (!iso) return "never";
    const d = new Date(iso);
    const mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins} min ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 48) return `${hrs} hr ago`;
    return `${Math.round(hrs / 24)} days ago`;
  }

  function renderEmpty() {
    app.innerHTML = `
      <div class="empty-state">
        <h2>No Scrape Has Run Yet</h2>
        <p>The GitHub Action that checks Target stores across Texas hasn't produced data.json yet.</p>
        <code>python -m scraper.run</code>
      </div>`;
  }

  function renderApp(data) {
    upcCode.textContent = data.upc;
    updatedLine.textContent = data.scraped_at
      ? `Updated ${timeAgo(data.scraped_at)}`
      : "Never scraped";

    const s = data.summary;
    const tiles = [
      { n: s.total_stores_checked, l: "Stores checked", cls: "" },
      { n: s.in_stock, l: "In stock", cls: "good" },
      { n: s.limited_stock, l: "Limited stock", cls: "warning" },
      { n: s.out_of_stock + (s.unknown || 0), l: "Out of stock / unknown", cls: "critical" },
    ];

    const stores = data.stores || [];
    if (stores.length === 0) {
      app.innerHTML = `
        <div class="stat-grid">
          ${tiles.map(t => `<div class="stat-tile ${t.cls}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join("")}
        </div>
        <div class="no-results"><h2>No Store Data Yet</h2><p>Check back after the next scheduled scrape.</p></div>`;
      return;
    }

    app.innerHTML = `
      <div class="stat-grid">
        ${tiles.map(t => `<div class="stat-tile ${t.cls}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join("")}
      </div>
      <div class="controls">
        <input type="search" id="q" placeholder="Search city or store…" aria-label="Search city or store" />
        <select id="status-filter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="IN_STOCK">In stock</option>
          <option value="LIMITED_STOCK">Limited stock</option>
          <option value="OUT_OF_STOCK">Out of stock</option>
          <option value="UNKNOWN">Unknown</option>
        </select>
        <select id="sort-by" aria-label="Sort by">
          <option value="city">Sort: City</option>
          <option value="status">Sort: Status (in-stock first)</option>
          <option value="distance">Sort: Distance</option>
        </select>
        <span class="result-count" id="result-count"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>Store</th>
              <th>City</th>
              <th>ZIP</th>
              <th class="num">Distance</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>`;

    const q = document.getElementById("q");
    const statusFilter = document.getElementById("status-filter");
    const sortBy = document.getElementById("sort-by");
    const rowsEl = document.getElementById("rows");
    const resultCount = document.getElementById("result-count");

    const statusRank = { IN_STOCK: 0, LIMITED_STOCK: 1, OUT_OF_STOCK: 2, NOT_SOLD_IN_STORE: 2, UNKNOWN: 3 };

    function renderRows() {
      const term = q.value.trim().toLowerCase();
      const statusVal = statusFilter.value;
      let filtered = stores.filter(r => {
        if (statusVal && r.status !== statusVal) return false;
        if (!term) return true;
        return (
          (r.city || "").toLowerCase().includes(term) ||
          (r.name || "").toLowerCase().includes(term) ||
          (r.address || "").toLowerCase().includes(term)
        );
      });

      const sortKey = sortBy.value;
      filtered = filtered.slice().sort((a, b) => {
        if (sortKey === "status") return (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9);
        if (sortKey === "distance") return (a.distance_from_search_point ?? 999) - (b.distance_from_search_point ?? 999);
        return (a.city || "").localeCompare(b.city || "") || (a.name || "").localeCompare(b.name || "");
      });

      resultCount.textContent = `${filtered.length} of ${stores.length} stores`;

      if (filtered.length === 0) {
        rowsEl.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px;">No stores match your filters.</td></tr>`;
        return;
      }

      rowsEl.innerHTML = filtered.map(r => {
        const meta = STATUS_META[r.status] || STATUS_META.UNKNOWN;
        const dist = r.distance_from_search_point != null ? `${Number(r.distance_from_search_point).toFixed(1)} mi` : "—";
        return `
          <tr>
            <td><span class="chip ${meta.chip}">${meta.label}</span></td>
            <td><div class="store-name">${escapeHtml(r.name || "Target")}</div><div class="store-addr">${escapeHtml(r.address || "")}</div></td>
            <td>${escapeHtml(r.city || "")}</td>
            <td class="num">${escapeHtml(r.zip || "")}</td>
            <td class="num">${dist}</td>
          </tr>`;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    q.addEventListener("input", renderRows);
    statusFilter.addEventListener("change", renderRows);
    sortBy.addEventListener("change", renderRows);
    renderRows();
  }

  fetch("./data.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      if (!data.scraped_at) {
        upcCode.textContent = data.upc || "—";
        updatedLine.textContent = "Never scraped";
        renderEmpty();
      } else {
        renderApp(data);
      }
    })
    .catch(() => {
      updatedLine.textContent = "Error loading data";
      renderEmpty();
    });
})();
</script>
</body>
</html>
