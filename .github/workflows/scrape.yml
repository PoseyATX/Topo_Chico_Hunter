name: Scrape Topo Chico stock

# Runs daily plus on demand. The scraper degrades gracefully per source
# (Target / Randalls / Tom Thumb / web search each wrapped so one failing
# doesn't fail the run) -- see README's "Known limitations" for what each
# source can be expected to actually return on a given day.
on:
  schedule:
    - cron: "0 13 * * *" # ~8am US Central daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium (for Randalls/Tom Thumb, which need a real browser)
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: python -m scraper.run

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "topo-chico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update stock data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
