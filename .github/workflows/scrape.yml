name: Scrape Topo Chico stock

# No `schedule:` trigger yet: the Randalls/Tom Thumb endpoints in
# scraper/albertsons_scraper.py are first-pass guesses, not yet confirmed
# against live traffic -- see README's "Status" section. Add a `schedule:`
# block back once a manual "Run workflow" succeeds reliably (and point
# `runs-on:` below at a self-hosted runner if these banners turn out to CAPTCHA
# datacenter IPs the way Target does). Until then this only runs on demand or
# when the scraper code changes.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest # swap for a self-hosted runner to get real data + automatic daily runs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.run

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "topo-chico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update stock data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
