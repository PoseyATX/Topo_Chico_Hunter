# Manual-only dev tool: scans Randalls/Tom Thumb pages for embedded API
# references and real network traffic. Run from the Actions tab ("Run
# workflow") whenever scraper/albertsons_scraper.py needs re-diagnosing
# against live traffic -- this sandbox has no route to these sites to test
# locally.
name: Diagnose Albertsons endpoints

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.diagnose

  diagnose-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m scraper.diagnose_playwright
